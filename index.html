<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV of Truong Van Long - PHP Developer." />
    <title>Truong Van Long | CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main class="cv-sheet">
      <div class="lang-switch" aria-label="Language switcher">
        <button id="btnVi" class="lang-btn" type="button">VI</button>
        <button id="btnEn" class="lang-btn" type="button">EN</button>
      </div>

      <header class="cv-header">
        <div class="identity">
          <h1 id="name">TRUONG VAN LONG</h1>
          <p id="role" class="role"></p>
          <p class="contact-line">
            <span id="phone"></span>
            <span class="divider">|</span>
            <span id="email"></span>
          </p>
          <p class="contact-line">
            <span id="github"></span>
            <span class="divider">|</span>
            <span id="linkedin"></span>
          </p>
          <p id="address" class="address"></p>
        </div>
        <figure class="photo-frame" aria-label="Candidate photo">
          <img src="assets/CVProfile.jpg" alt="Profile" class="profile-pic" />
          <figcaption>PHOTO</figcaption>
        </figure>
      </header>

      <section>
        <h2 id="skillsTitle" class="section-title">SKILLS</h2>
        <table class="cv-table">
          <thead class="sr-only">
            <tr>
              <th scope="col">Category</th>
              <th scope="col">Details</th>
            </tr>
          </thead>
          <tbody id="skillsTableBody"></tbody>
        </table>
      </section>

      <section>
        <h2 id="objectivesTitle" class="section-title">CAREER OBJECTIVE</h2>
        <table class="cv-table">
          <thead class="sr-only">
            <tr>
              <th scope="col">Timeline</th>
              <th scope="col">Objective</th>
            </tr>
          </thead>
          <tbody id="objectivesTableBody"></tbody>
        </table>
      </section>

      <section>
        <h2 id="projectsTitle" class="section-title">PROJECTS</h2>
        <div id="projects" class="project-list"></div>
      </section>

      <section>
        <h2 id="educationTitle" class="section-title">EDUCATION</h2>
        <p id="educationText" class="education-text"></p>
      </section>

      <section>
        <h2 id="activitiesTitle" class="section-title">EXPERIENCE &amp; ACTIVITIES</h2>
        <ul id="activitiesList" class="bullet-list"></ul>
      </section>

      <section>
        <h2 id="certificationsTitle" class="section-title">CERTIFICATIONS &amp; AWARDS</h2>
        <p id="certificationsText" class="certification-line"></p>
      </section>
    </main>

    <script src="assets/js/cv-data.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
